<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Marks File</title>
</head>
<body>
    <h2>Upload Marks File</h2>
    <!-- The enctype attribute is mandatory for uploading files -->
    <form action="25-BestMark.php" method="post" enctype="multipart/form-data">
        <label for="marksFile">Select the marks file (Format: student#mark):</label><br><br>
        <input type="file" name="marksFile" id="marksFile" accept=".txt" required>
        <br><br>
        <input type="submit" value="Upload and Calculate Best Mark" name="submit">
    </form>
</body>
</html>
